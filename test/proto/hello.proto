syntax = "proto3";

package pb.user;

option go_package = "github.com/fengjx/lctest/proto/pbuser";

// gomodpath=github.com/fengjx/lctest

message User {
  string name = 1;
  int32 age = 2;
  float height = 3;
  bool is_married = 4;
}

enum Status {
  STATUS_NONE = 0;
  STATUS_NORMAL = 1;
  STATUS_DISABLE = 2;
}